# Danh sách task MVP — MỘT hàng đợi chung, sắp theo thứ tự thực hiện.
# Không còn lane: agent nào (Claude Code, Codex, …) cũng làm được bất kỳ task nào.
# - File này là cấu hình TĨNH (task gì, phụ thuộc gì, thứ tự nào). KHÔNG ghi trạng thái vào đây.
# - THỨ TỰ TRONG FILE = thứ tự ưu tiên. Mỗi task luôn đứng SAU mọi deps của nó (công cụ kiểm tra).
# - Trạng thái suy ra từ git/GitHub:
#     done        = có commit trên main với tiêu đề chứa "[<id>]"
#     in_progress = có nhánh "*/<id>-*" trên origin hoặc PR đang mở có "[<id>]" trong tiêu đề
#     ready       = chưa done, không in_progress, mọi deps đã done
# - Chọn task: `pnpm ai:next` = task ready ĐẦU TIÊN theo thứ tự file (bỏ qua task `manual`).
#   Nhiều agent chạy cùng lúc thì mỗi agent nhận task ready kế tiếp chưa ai nhận (WORKFLOW §4).
# - Chỉ người (human) được sửa file này (thêm task, đổi thứ tự). Agent đề xuất thay đổi qua PR riêng.
# - Chi tiết quy trình: docs/ai/WORKFLOW.md. Mô tả + tiêu chí hoàn thành của từng task: docs/PLAN.md §9
#   (task có hậu tố a/b là phần tách ra từ task gốc cùng số: a = server/nền tảng, b = giao diện;
#   a đứng trước b và b dựng được bằng mock khi contract của a đã merge — WORKFLOW §6).
#
# Các trường của task:
#   deps   : task phải merge vào main trước khi bắt đầu
#   est    : ước lượng (ngày công)
#   ver    : release dự kiến chứa task
#   ui     : true = có giao diện → áp dụng "Chuẩn UI" (AGENTS.md): i18n, sáng/tối, a11y, ảnh chụp trong PR
#   human  : true = có bước người phải làm (secret, UI nhà cung cấp) — agent chuẩn bị code/tài liệu/script, người thực hiện
#   manual : true = chỉ người làm; `pnpm ai:next` không bao giờ chọn

