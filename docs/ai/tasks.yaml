  - { id: T0.1b, lane: claude-1, ui: true, title: "App shell: Tailwind + shadcn/ui, theme token sáng/tối, root layout, sidebar khung, trang lỗi 404/500", deps: [T0.1a], est: 0.75, ver: 0.1.0 }
  - { id: T0.2,  lane: claude-2, title: "Commitlint + lefthook, hoàn thiện PR template (giữ trường Agent/Task/Handoff), CODEOWNERS, CONTRIBUTING", deps: [T0.1a], est: 0.5, ver: 0.1.0, stealable: true, touches: [CONTRIBUTING.md, CODEOWNERS] }
  - { id: T0.3a, lane: claude-2, title: "packages/i18n: loader, types, normalizeVi, script i18n:check (+ sort key), ESLint no-literal-string", deps: [T0.1a], est: 1, ver: 0.1.0 }
