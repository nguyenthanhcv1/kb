# Danh sách task MVP và lane cho 3 agent chạy song song (claude-1, claude-2, codex-1).
# Lane codex-2 cũ (Platform & collab) đã được chia: collab + logic editor không-UI + hạ tầng test → claude-1; platform/CI/hạ tầng → claude-2.
# - File này là cấu hình TĨNH (ai làm gì, phụ thuộc gì). KHÔNG ghi trạng thái vào đây.
# - Trạng thái suy ra từ git/GitHub:
#     done        = có commit trên main với tiêu đề chứa "[<id>]"
#     in_progress = có nhánh "*/<id>-*" trên origin hoặc PR đang mở có "[<id>]" trong tiêu đề
#     ready       = chưa done, không in_progress, mọi deps đã done
# - Chỉ người (human) được sửa file này (thêm task, đổi lane). Agent đề xuất thay đổi qua PR riêng.
# - Chi tiết quy trình: docs/ai/WORKFLOW.md. Mô tả + tiêu chí hoàn thành của từng task: docs/PLAN.md §9
#   (task có hậu tố a/b là phần tách ra từ task gốc cùng số: a = server/nền tảng, b = UI).

version: 1

lanes:
  claude-1:
    tool: claude-code
    name: "UI lõi & editor + collab"
    owns:
      - apps/web/src/app/layout.tsx
      - apps/web/src/app/(auth)/**
      - apps/web/src/app/globals.css
      - apps/web/src/components/ui/**
      - apps/web/src/components/layout/**
      - apps/web/src/components/editor/**
      - apps/web/src/lib/collab/**
      - apps/web/tailwind.config.*
      - apps/web/components.json
      - packages/editor/src/extensions/**
      - packages/editor/src/ui/**
      - packages/editor/src/table/drag.ts
      - packages/i18n/messages/*/common.json
      - packages/i18n/messages/*/auth.json
      - packages/i18n/messages/*/editor.json
      - packages/i18n/messages/*/table.json
      - apps/web/e2e/editor/**
      - apps/web/e2e/table/**
      # --- collab, logic editor không-UI, hạ tầng test (trước thuộc codex-2) ---
      - apps/collab/**
      - packages/editor/src/extract/**
      - packages/editor/src/table/paste.ts
      - packages/editor/src/table/csv.ts
      - packages/editor/src/migrations/**
      - packages/editor/test/**
      - apps/web/playwright.config.ts
      - apps/web/e2e/support/**
      - apps/web/vitest.config.ts
  claude-2:
    tool: claude-code
    name: "UI tính năng + platform"
    owns:
      - apps/web/src/app/(app)/**
      - apps/web/src/app/invite/**
      - apps/web/src/components/space/**
      - apps/web/src/components/tree/**
      - apps/web/src/components/search/**
      - apps/web/src/components/history/**
      - apps/web/src/components/admin/**
      - apps/web/src/components/settings/**
      - packages/emails/**
      - packages/i18n/messages/*/nav.json
      - packages/i18n/messages/*/space.json
      - packages/i18n/messages/*/tree.json
      - packages/i18n/messages/*/search.json
      - packages/i18n/messages/*/history.json
      - packages/i18n/messages/*/settings.json
      - packages/i18n/messages/*/admin.json
      - packages/i18n/messages/*/email.json
      - packages/i18n/messages/*/whatsNew.json
      - changelog/vi/**
      - docs/user-guide/**
      - docs/glossary.md
      - apps/web/e2e/features/**
      # --- platform: tooling, CI/CD, release, Docker, hạ tầng (trước thuộc codex-2) ---
      - package.json
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig*.json
      - .lefthook.yml
      - .github/**
      - infra/**
      - scripts/**
      - release-please-config.json
      - .release-please-manifest.json
      - .env.example
      - apps/web/Dockerfile
      - apps/web/next.config.ts
      - apps/web/src/lib/env.ts
      - packages/config/**
      - packages/shared/src/env.ts
      - packages/i18n/src/**
      - packages/i18n/scripts/**
      - docs/runbooks/**
      - docs/adr/**
  codex-1:
    tool: codex
    name: "DB & server"
    owns:
      - supabase/**
      - apps/web/src/server/**
      - apps/web/src/app/api/**
      - apps/web/src/app/auth/callback/**
      - apps/web/src/middleware.ts
      - apps/web/src/lib/supabase/**
      - packages/db/**
      - packages/shared/src/errors.ts
      - packages/i18n/messages/*/errors.json
      - packages/i18n/messages/*/audit.json
      - scripts/seed-perf.ts
  human:
    tool: human
    name: "Người điều phối"
    owns:
      - AGENTS.md
      - CLAUDE.md
      - docs/PLAN.md
      - docs/ai/**
    # Người: quyết định, cấp secret, thao tác trên Coolify/Hostinger/Cloudflare/Google Cloud UI, review & merge.

# Các trường của task:
#   lane      : agent chịu trách nhiệm
#   deps      : task phải merge vào main trước khi bắt đầu
#   est       : ước lượng (ngày công)
#   ver       : release dự kiến chứa task
#   ui        : true = chỉ Claude được làm
#   stealable : true = agent khác được mượn khi lane gốc đang bận — task không-UI: cả Claude và Codex; task UI: chỉ Claude (WORKFLOW §6)
#   human     : true = có bước người phải làm (secret, UI nhà cung cấp) — agent chuẩn bị tài liệu/script, người thực hiện
#   touches   : file NGOÀI vùng lane mà task này được phép sửa (ngoại lệ có chủ đích)
#
# Vùng được sửa khi làm một task = owns của lane gốc của task + touches của task.
# Khi 2 glob cùng khớp một file, glob CỤ THỂ HƠN thắng (vd scripts/seed-perf.ts thuộc codex-1 dù scripts/** thuộc claude-2).

tasks:
  # ---------- M0 — Nền tảng (v0.1.0) ----------
