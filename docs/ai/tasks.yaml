  - { id: T0.4,  lane: codex-1, title: "Supabase CLI local: config.toml, migration extensions, schema app, test 'mọi bảng bật RLS', docker-compose", deps: [], est: 1, ver: 0.1.0, touches: [infra/docker-compose.yml] }
  - { id: T0.5,  lane: claude-2, title: "CI ci.yml: lint, typecheck, unit, i18n, pr-title, db, build, licenses", deps: [T0.3a, T0.4], est: 1, ver: 0.1.0 }
  - { id: T0.11, lane: claude-2, title: "Công cụ agent: pnpm ai:next (chọn task), pnpm ai:status, CI agent-scope (chặn sửa file ngoài lane, chặn Codex sửa UI)", deps: [T0.5], est: 0.5, ver: 0.1.0 }
  - { id: T0.6a, lane: claude-2, title: "release-please + release-vi-notes.yml + inject-vi-changelog + build-changelog (changelog.json), /api/health trả version", deps: [T0.5], est: 1, ver: 0.1.0, touches: ["apps/web/src/app/api/health/**"] }
  - { id: T0.6b, lane: claude-2, ui: true, title: "Trang What's new + version ở footer + Settings › Giới thiệu", deps: [T0.3b, T0.6a], est: 0.5, ver: 0.1.0, touches: [apps/web/src/components/layout/app-version.tsx] }
  - { id: T0.7,  lane: claude-2, title: "Dockerfile web/collab/migrate, HEALTHCHECK, env zod, build-images.yml (GHCR)", deps: [T0.1a], est: 1, ver: 0.1.0, touches: ["apps/web/src/app/api/health/**", apps/collab/Dockerfile] }
  - { id: T0.8,  lane: claude-2, human: true, title: "Staging trên Coolify (Hostinger kb-ops-1), Cloudflare DNS/Origin CA, firewall, secrets, deploy.yml", deps: [T0.7], est: 2, ver: 0.1.0 }
  - { id: T0.9,  lane: claude-2, human: true, title: "Backup pg_dump → Cloudflare R2, lifecycle, restore runbook + job kiểm thử restore", deps: [T0.8], est: 1, ver: 0.1.0 }
  - { id: T0.10, lane: claude-1, human: true, title: "Spike: GoTrue hook, WS qua Cloudflare/Traefik, JWT trong collab, preview + DNS, OAuth công ty, Gmail App Password", deps: [T0.8], est: 1, ver: 0.1.0, touches: ["docs/adr/**", "infra/**"] }

