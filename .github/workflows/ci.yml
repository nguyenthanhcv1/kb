# CI chính (T0.5). Branch protection chỉ cần yêu cầu job `ci` (gom kết quả mọi job bên dưới)
# và `pr-title` (workflow riêng pr-title.yml, chạy lại khi sửa tiêu đề PR).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: lint
      - name: ESLint (gồm chặn chuỗi literal trong JSX)
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: typecheck
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: unit
      - name: Unit test các package (Vitest)
        run: pnpm test
      - name: Unit test script repo (node:test)
        run: pnpm test:scripts

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: So khớp key vi/en, tham số ICU, thứ tự key
        run: pnpm i18n:check

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: License dependency trong allowlist (AGENTS.md §5)
        run: pnpm licenses:check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      - run: pnpm build

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # config.toml tham chiếu env() cho Google OAuth — CI không test OAuth nên dùng giá trị giả.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # giữ khớp supabase/README.md
      - name: Khởi động Postgres, chạy migration + seed
        run: supabase db start
      - name: pgTAP (gồm test "mọi bảng bật RLS")
        run: supabase test db
      - name: Migration chạy lại được từ đầu (db reset)
        run: supabase db reset
      - uses: ./.github/actions/setup
      - name: Integration test kb-collab (role kb_collab, WebSocket thật)
        env:
          COLLAB_TEST_DATABASE_URL: postgresql://kb_collab:kb_collab_local@127.0.0.1:54322/postgres
          COLLAB_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @kb/collab exec vitest run test/
      - name: Dừng Supabase
        if: always()
        run: supabase stop --no-backup

  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, unit, i18n, licenses, build, db]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mọi job phải thành công
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Kết quả: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Có job không thành công ($r)"
              exit 1
            fi
          done
