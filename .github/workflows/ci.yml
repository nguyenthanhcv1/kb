# CI chính (T0.5). Branch protection chỉ cần yêu cầu job `ci` (gom kết quả mọi job bên dưới)
# và `pr-title` (workflow riêng pr-title.yml, chạy lại khi sửa tiêu đề PR).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: lint
      - name: ESLint (gồm chặn chuỗi literal trong JSX)
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: typecheck
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: unit
      - name: Unit test các package (Vitest)
        run: pnpm test
      - name: Unit test script repo (node:test)
        run: pnpm test:scripts

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: So khớp key vi/en, tham số ICU, thứ tự key
        run: pnpm i18n:check

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: License dependency trong allowlist (AGENTS.md §5)
        run: pnpm licenses:check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      - run: pnpm build

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # config.toml tham chiếu env() cho Google OAuth — CI không test OAuth nên dùng giá trị giả.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # giữ khớp supabase/README.md
      - name: Khởi động Postgres + PostgREST/Kong, chạy migration + seed
        # Chỉ db, rest, kong (pgTAP, integration test qua supabase-js), storage-api (bucket attachments)
        # + mailpit (SMTP thật cho email lời mời và email thử).
        run: supabase start -x gotrue,realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: pgTAP (gồm test "mọi bảng bật RLS")
        run: supabase test db
      - name: Migration chạy lại được từ đầu (db reset)
        run: supabase db reset
      - uses: ./.github/actions/setup
      - name: Integration test kb-collab (role kb_collab, WebSocket thật)
        env:
          COLLAB_TEST_DATABASE_URL: postgresql://kb_collab:kb_collab_local@127.0.0.1:54322/postgres
          COLLAB_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @kb/collab exec vitest run test/
      - name: Integration test server actions trang (supabase-js → PostgREST → RLS)
        env:
          PAGES_TEST_SUPABASE_URL: http://127.0.0.1:54321
          # JWT secret mặc định của Supabase local (không phải secret thật).
          PAGES_TEST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          PAGES_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @kb/web exec vitest run src/server/pages/pages.integration.test.ts
      - name: Integration test contract Space (supabase-js → PostgREST → RLS)
        env:
          SPACES_TEST_SUPABASE_URL: http://127.0.0.1:54321
          SPACES_TEST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          SPACES_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @kb/web exec vitest run src/server/space/space.integration.test.ts
      - name: Integration test cài đặt cá nhân (supabase-js → PostgREST → RLS + grant cột)
        env:
          PROFILE_TEST_SUPABASE_URL: http://127.0.0.1:54321
          PROFILE_TEST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          PROFILE_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @kb/web exec vitest run src/server/profile/profile.integration.test.ts
      - name: Integration test thành viên + lời mời (PostgREST → RLS, SMTP → Mailpit)
        env:
          MEMBERS_TEST_SUPABASE_URL: http://127.0.0.1:54321
          # JWT secret mặc định của Supabase local (không phải secret thật).
          MEMBERS_TEST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          MEMBERS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          MEMBERS_TEST_SMTP_HOST: 127.0.0.1
          MEMBERS_TEST_SMTP_PORT: "54325"
          MEMBERS_TEST_MAILPIT_URL: http://127.0.0.1:54324
        run: pnpm --filter @kb/web exec vitest run src/server/members/members.integration.test.ts
      - name: Integration test quản trị truy cập (supabase-js → PostgREST → RLS/hàm admin_*)
        env:
          ADMIN_TEST_SUPABASE_URL: http://127.0.0.1:54321
          ADMIN_TEST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          ADMIN_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @kb/web exec vitest run src/server/admin/admin.integration.test.ts
      - name: Integration test tệp đính kèm (supabase-js → PostgREST/Storage → RLS)
        env:
          ATTACHMENTS_TEST_SUPABASE_URL: http://127.0.0.1:54321
          ATTACHMENTS_TEST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          ATTACHMENTS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @kb/web exec vitest run src/server/attachments/attachments.integration.test.ts
      - name: Integration test gửi email (SMTP → Mailpit)
        env:
          MAIL_TEST_SMTP_PORT: 54325
          MAIL_TEST_MAILPIT_URL: http://127.0.0.1:54324
        run: pnpm --filter @kb/web exec vitest run src/server/mail/mail.integration.test.ts
      - name: Dừng Supabase
        if: always()
        run: supabase stop --no-backup

  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, unit, i18n, licenses, build, db]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mọi job phải thành công
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Kết quả: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Có job không thành công ($r)"
              exit 1
            fi
          done
