# Build Docker images kb-web, kb-collab, kb-migrate (T0.7, docs/PLAN.md §7.2, §7.13).
# - push main      → ghcr.io/<owner>/kb-<name>:sha-<sha> + :main (deploy.yml, T0.8, deploys these)
# - tag vX.Y.Z     → + :X.Y.Z, :X.Y, :latest (release-please creates the tag)
# - PR changing Docker/app sources → build only (no push), with the container smoke test
name: Build images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "supabase/migrations/**"
      - "infra/migrate/**"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            # Liveness endpoint + the variables the startup env check requires.
            smoke: /api/health
            port: 3000
            env: "-e SUPABASE_URL=http://127.0.0.1:54321 -e SUPABASE_ANON_KEY=ci -e SUPABASE_SERVICE_ROLE_KEY=ci"
            # Must make the container exit non-zero at startup.
            bad_env: ""
          - name: collab
            dockerfile: apps/collab/Dockerfile
            smoke: /health
            port: 3001
            env: ""
            bad_env: "-e APP_ENV=production"
          - name: migrate
            dockerfile: infra/migrate/Dockerfile
            smoke: ""
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kb-${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=$(node -p "require('./.release-please-manifest.json')['.'] ?? '0.0.0'" 2>/dev/null || echo 0.0.0)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=kb-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=kb-${{ matrix.name }}

      - name: Smoke test (missing env → exit with the variable names)
        if: matrix.smoke != ''
        run: |
          set +e
          timeout 60 docker run --rm ${{ matrix.bad_env }} "$IMAGE:ci" 2>&1 | tee startup.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = 0 ] || [ "$code" = 124 ]; then echo "expected the container to exit non-zero (got $code)" >&2; exit 1; fi
          grep -q "Invalid environment variables" startup.log

      - name: Smoke test (container healthy)
        if: matrix.smoke != ''
        run: |
          set -euo pipefail
          docker run -d --name smoke -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.env }} "$IMAGE:ci"
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
            sleep 2
          done
          docker logs smoke
          curl -fsS "http://127.0.0.1:${{ matrix.port }}${{ matrix.smoke }}" | tee /dev/stderr | grep -q '"status":"ok"'
          [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ]
          docker rm -f smoke

      - name: Smoke test (migrate refuses to run without DATABASE_URL)
        if: matrix.name == 'migrate'
        run: |
          if docker run --rm "$IMAGE:ci"; then echo "expected a non-zero exit" >&2; exit 1; fi

      - name: Image size
        run: |
          size=$(docker image inspect "$IMAGE:ci" --format '{{.Size}}')
          echo "$IMAGE: $((size / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=kb-${{ matrix.name }}
